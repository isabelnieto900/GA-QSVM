[project]
name = "ga-qsvm"
version = "0.1.0"
description = "Simplified reproduction of GA-QSVM (arXiv:2511.19160)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy==1.26.4",
    "scikit-learn==1.6.0",
    "scipy>=1.14,<2",
    "qiskit==1.3.1",
    "qiskit-machine-learning==0.8.2",
    "squlearn==0.8.4",
    "pennylane==0.34.0",
    "autoray==0.6.7",
    "seaborn>=0.13,<0.14",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
